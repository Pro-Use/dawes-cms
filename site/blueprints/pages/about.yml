title: About
options:
  preview: "/pages/{{ page.slug }}"

tabs:
  content_tab:
    label: Content
    icon: text
    columns:
      - width: 2/4
          fields:
            cover:
              label: Cover Images
              type: files
              max: 3
              layout: cards
              size: tiny
              image:
                ratio: 1/1
                cover: true
                back: white
              help: These images appear on home page when hover over name
      - width: 1/4
          fields:
            social:
              label: Social Media Links
              type: writer
      - width: 3/4
          fields:
            text:
              type: blocks
              fieldsets:
                - text
                - image
  seotab: seo